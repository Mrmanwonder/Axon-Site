name: One-off scanner test adjustment

on:
  push:
    branches: [fix/scanner-detection-no-stabilization]

permissions:
  contents: write

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scanner-detection-no-stabilization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update revalidation expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bench/tracking.test.mjs')
          s = p.read_text()
          old = """test('§68: a healthy track almost never asks for the global detector', () => {
  let track = acquire(createTrack(), squareQuad(100, 100, 200, 260), 0, { width: 640, height: 480 });
  const quad = squareQuad(100, 100, 200, 260);
  let globals = 0;
  let now = 0;
  // Three seconds of ordinary tracking at 60fps.
  for (let i = 0; i < 180; i++) {
    now += 16.7;
    if (needsGlobal(track, now)) { globals++; track.lastGlobalDetection = now; }
    const drift = squareQuad(100 + i * 0.4, 100 + i * 0.2, 200, 260);
    track = observeAll(track, drift, now);
  }
  assert.equal(track.state, 'tracking');
  assert.ok(globals <= 1,
    `${globals} global searches during three seconds of clean tracking — the point is that this is rare`);
});"""
          new = """test('a healthy track is globally revalidated without reverting to full-frame search every frame', () => {
  let track = acquire(createTrack(), squareQuad(100, 100, 200, 260), 0, { width: 640, height: 480 });
  let globals = 0;
  let now = 0;
  // Three seconds of ordinary tracking at 60fps. Revalidation is intentional:
  // a local corner tracker must not be able to hold a false rectangle forever.
  for (let i = 0; i < 180; i++) {
    now += 16.7;
    if (needsGlobal(track, now)) { globals++; track.lastGlobalDetection = now; }
    const drift = squareQuad(100 + i * 0.4, 100 + i * 0.2, 200, 260);
    track = observeAll(track, drift, now);
  }
  assert.equal(track.state, 'tracking');
  assert.ok(globals >= 1 && globals <= 2,
    `${globals} global searches during three seconds — expected bounded anti-drift revalidation`);
});"""
          if old not in s:
              raise SystemExit('target test block not found')
          p.write_text(s.replace(old, new))
          PY
      - run: npm ci
      - run: npm test
      - name: Commit tested adjustment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/tracking.test.mjs
          git diff --cached --check
          git commit -m "test: expect bounded scanner revalidation"
          git push origin HEAD:fix/scanner-detection-no-stabilization
