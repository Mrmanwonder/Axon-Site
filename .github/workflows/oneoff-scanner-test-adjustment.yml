name: One-off scanner test adjustment

on:
  push:
    branches:
      - fix/scanner-detection-no-stabilization

permissions:
  contents: write

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scanner-detection-no-stabilization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update revalidation expectation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bench/tracking.test.mjs')
          s = p.read_text()
          old = "assert.ok(globals <= 1,"
          new = "assert.ok(globals >= 1 && globals <= 2,"
          if old not in s:
              raise SystemExit('target assertion not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - run: npm ci
      - run: npm test
      - name: Commit tested adjustment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bench/tracking.test.mjs
          git diff --cached --check
          git commit -m "test: expect bounded scanner revalidation"
          git push origin HEAD:fix/scanner-detection-no-stabilization
