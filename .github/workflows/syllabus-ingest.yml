name: Ingest syllabi

# Loads the official syllabus topic trees listed in curriculum/syllabi/sources.json.
# The text goes from the board's PDF straight into the database: it is never
# committed (this repository is public). Each PDF must match its recorded
# SHA-256, and every objective must pass the parser's audit, or nothing loads.
# Documents load as DRAFT; a person marks them verified before students see them.

# After a migration it runs once the exam ingest has finished, never beside it:
# two loaders at once on the Nano instance is part of what stalled it on 26
# Oct (AXO-291).
on:
  workflow_run:
    workflows: ["Ingest exam timetables"]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - "curriculum/syllabi/**"
      - "scripts/syllabus/**"
      - ".github/workflows/syllabus-ingest.yml"
  workflow_dispatch:

concurrency:
  group: syllabus-ingest
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ingest:
    # Only the exam ingest that followed "Apply migrations", not its daily run.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'workflow_run' && github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the PDF reader and psql
        run: |
          python -m pip install --quiet -r scripts/syllabus/requirements.txt
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
      - name: Parser and extractor tests
        run: |
          node --test tests/db/syllabus-parse.test.mjs tests/db/syllabus-outline.test.mjs tests/db/syllabus-cbse.test.mjs
          python scripts/syllabus/test_extract.py
      - name: Fetch, verify and parse
        run: node scripts/syllabus/ingest.mjs --out "$RUNNER_TEMP/syllabus.sql"
      - name: Load as draft
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/syllabus/load.mjs --skip-if-slow "$RUNNER_TEMP/syllabus.sql"
