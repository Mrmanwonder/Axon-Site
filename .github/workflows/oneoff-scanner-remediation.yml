name: One-off scanner remediation

on:
  push:
    branches: [fix/scanner-detection-no-stabilization]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/scanner-detection-no-stabilization
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Escape literal source interpolation in the one-off patcher
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/oneoff-scanner-remediation.mjs')
          path.write_text(path.read_text().replace('${', r'\${'))
          PY
      - name: Apply scanner remediation patch
        run: node scripts/oneoff-scanner-remediation.mjs
      - name: Commit generated scanner changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scan/capture.js src/scan/edges.js src/scan/corner-search.js src/scan/detect-worker.js src/scan/track.js bench/capture.test.mjs bench/tracking.test.mjs
          git diff --cached --check
          git commit -m "fix: remove scanner stabilization and tighten document lock"
          git push origin HEAD:fix/scanner-detection-no-stabilization
