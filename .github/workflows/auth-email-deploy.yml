name: Publish Supabase Auth emails

# Only trusted main gets the production credential. Pull requests validate
# generated HTML but cannot invoke the Management API.
on:
  pull_request:
    paths:
      - "supabase/templates/**"
      - "scripts/build-email-templates.mjs"
      - "scripts/deploy-email-templates.mjs"
      - "harness/emailTemplates.test.mjs"
      - "harness/supabaseEmailDeploy.test.mjs"
      - ".github/workflows/auth-email-deploy.yml"
  push:
    branches: [main]
    paths:
      - "supabase/templates/**"
      - "scripts/build-email-templates.mjs"
      - "scripts/deploy-email-templates.mjs"
      - ".github/workflows/auth-email-deploy.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview differences only (do not write to Supabase)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: supabase-auth-email-production
  cancel-in-progress: false

jobs:
  validate:
    name: Validate generated authentication emails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests and generator parity
        run: node --test harness/emailTemplates.test.mjs harness/supabaseEmailDeploy.test.mjs
      - name: Validate HTML and Supabase placeholders
        run: node scripts/deploy-email-templates.mjs --validate

  publish:
    name: Publish and verify hosted Supabase Auth templates
    needs: validate
    # Manual runs are allowed only from main. No secrets on PRs.
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require Supabase Management API token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "::error title=Missing Supabase token::SUPABASE_ACCESS_TOKEN must be a Supabase Management API personal access token with auth config read/write permissions. A database URL or service-role key cannot update hosted email templates."
            exit 1
          fi
      - name: Publish templates (or preview manual dry-run)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: dlgcqieyevoebefhcggi
          RUN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '--dry-run' || '--deploy' }}
        run: node scripts/deploy-email-templates.mjs "$RUN_MODE"
