name: CI

# Audit Finding 9 / Perfection Plan Phase 4.1: none of this codebase's own
# "confirmed" vs. "carried" vs. "untested" distinctions matter if the test
# suites it already has don't run automatically. This job runs npm test
# (bench/*.test.mjs + harness/*.test.mjs) and the pgTAP-style suites in
# supabase/tests/*.sql on every push and pull request.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-tests:
    name: npm test (bench + harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  sql-tests:
    name: supabase/tests/*.sql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # Boots the full local stack (Postgres + GoTrue, etc.) so the auth.users
      # rows every suite's fixtures insert into actually resolve, then applies
      # every migration in supabase/migrations/ from a clean database — the
      # same schema this project runs in production.
      - name: Start local Supabase stack and apply migrations
        run: |
          supabase start
          supabase db reset --local

      # Each file in supabase/tests/ is a self-contained, rolled-back suite
      # that ends with `select count(*) ... as failed from public._r`. Run
      # every one and fail the job if any suite reports failed > 0, instead
      # of relying on someone reading the output by hand.
      - name: Run SQL test suites
        run: |
          set -e
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          status=0
          for f in supabase/tests/*.sql; do
            echo "::group::$f (human-readable)"
            psql "$DB_URL" -v ON_ERROR_STOP=1 -f "$f" || true
            echo "::endgroup::"

            # Every suite's second-to-last statement is
            # `select count(*) as total, ... as passed, ... as failed from public._r`,
            # immediately before the failing-rows detail select and the closing
            # `rollback;`. Re-run in a fresh transaction, unaligned/tuples-only, and
            # read just that first line so pass/fail is judged by a number, not by
            # scanning printed output.
            counts="$(psql "$DB_URL" -t -A -F'|' -v ON_ERROR_STOP=1 -f "$f" | grep -E '^[0-9]+\|[0-9]+\|[0-9]+$' | head -n1)"
            failed="$(echo "$counts" | cut -d'|' -f3)"
            if [ -z "$failed" ] || [ "$failed" != "0" ]; then
              echo "::error file=$f::${failed:-unparseable}} assertion(s) failed in $f (counts line: '$counts')"
              status=1
            fi
          done
          exit $status

  # Nothing in this repository applies a migration to the live project — see
  # supabase/migrations/README.md. This job cannot apply one either (it has no
  # credentials, by design), so it does the next most useful thing: it makes a
  # PR that adds one impossible to skim past. Two merged migrations have already
  # gone unapplied for want of exactly this.
  #
  # It never fails. A red check here would be a check somebody turns off; this
  # is a summary a reviewer reads. Real enforcement needs the project's
  # credentials as repository secrets AND the twenty-migration gap in that README
  # closed first, or a parity check would be red from its very first run.
  migration-notice:
    name: migrations need applying by hand
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Say so, loudly, if this PR adds a migration
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" \
            -- 'supabase/migrations/*.sql' || true)

          if [ -z "$changed" ]; then
            echo "No migration files touched." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## This PR changes the database schema"
            echo
            echo '```'
            echo "$changed"
            echo '```'
            echo
            echo "**Merging does not apply these.** Nothing in CI does."
            echo "\`supabase db reset --local\` above builds a throwaway database for the"
            echo "pgTAP suites and destroys it; the live project is never touched."
            echo
            echo "Apply them by hand and confirm by querying the project, then merge:"
            echo
            echo '```sh'
            echo "supabase db push --project-ref dlgcqieyevoebefhcggi"
            echo '```'
            echo
            echo "If code in this PR **reads** anything these add, apply them **first** —"
            echo "PostgREST errors on an unknown column, so a select naming one that is not"
            echo "there yet takes the whole screen down rather than degrading."
            echo
            echo "See \`supabase/migrations/README.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning title=Migration needs applying by hand::This PR changes supabase/migrations/. Merging will not apply it — see the job summary."
