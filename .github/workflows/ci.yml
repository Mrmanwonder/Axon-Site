name: CI

# Audit Finding 9 / Perfection Plan Phase 4.1: none of this codebase's own
# "confirmed" vs. "carried" vs. "untested" distinctions matter if the test
# suites it already has don't run automatically. This job runs npm test
# (bench/*.test.mjs + harness/*.test.mjs) and the pgTAP-style suites in
# supabase/tests/*.sql on every push and pull request.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node-tests:
    name: npm test (bench + harness)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: AXO-188 controlled reference transport benchmark
        run: node bench/upload-reference.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: axo-188-reference
          path: bench/results/axo-188-reference.json
      - run: npm run curriculum:validate
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:ui
      - run: npm run test:db
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
      - run: npm run test:a11y
      - name: Preserve design fixture screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axo-134-design-preview
          retention-days: 7
          if-no-files-found: ignore
          path: |
            test-results/**/overview-*.png
            test-results/**/review-*.png
            test-results/**/table-*.png
            test-results/**/math-*.png
            test-results/**/unreadable-*.png
            test-results/**/completed-*.png
            test-results/**/zoom-proxy-*.png


      # INV-01: a production build must not be able to select a development
      # adapter. `npm run build` runs this too, but Netlify is the only thing
      # that builds, so without this the check would not run on a pull request
      # — which is the one place it can still stop the change.
      - run: npm run check:config
      - run: npm run check:contract-parity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  eval-gate:
    name: eval gate (model_route changes need a passing eval run)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node harness/eval-gate.mjs --base origin/${{ github.base_ref }}

  sql-tests:
    name: supabase/tests/*.sql
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0

      # Boots the full local stack (Postgres + GoTrue, etc.) so the auth.users
      # rows every suite's fixtures insert into actually resolve, then applies
      # every migration in supabase/migrations/ from a clean database — the
      # same schema this project runs in production.
      - name: Start local Supabase stack and apply migrations
        run: |
          supabase start
          supabase db reset --local

      # Each file in supabase/tests/ is a self-contained, rolled-back suite
      # that ends with `select count(*) ... as failed from public._r`. Execute
      # each suite exactly once, stream that output, and fail the job if its
      # captured assertion summary reports failed > 0.
      - name: Run SQL test suites
        run: |
          set -uo pipefail
          DB_URL="postgresql://postgres:postgres@127.0.0.1:54322/postgres"
          status=0
          for f in supabase/tests/*.sql; do
            log="$(mktemp)"
            echo "::group::$f"
            # One execution only. Unaligned/tuples-only output keeps assertion
            # counts machine-parseable while still streaming planner, benchmark
            # and failure-detail evidence into the Actions log.
            if ! psql "$DB_URL" -t -A -F'|' -v ON_ERROR_STOP=1 -f "$f" 2>&1 | tee "$log"; then
              echo "::error file=$f::SQL execution failed"
              status=1
            fi
            echo "::endgroup::"

            counts="$(grep -E '^[0-9]+\|[0-9]+\|[0-9]+$' "$log" | head -n1 || true)"
            failed="$(printf '%s' "$counts" | cut -d'|' -f3)"
            if [ -z "$failed" ] || [ "$failed" != "0" ]; then
              echo "::error file=$f::${failed:-unparseable} assertion(s) failed in $f (counts line: '$counts')"
              status=1
            fi
            rm -f "$log"
          done
          exit $status

      - name: Verify concurrent authenticated saves against local Postgres
        run: node scripts/audit-commit-concurrency.mjs
        env:
          AXON_LOCAL_TEST_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres

      - name: Verify commit-totals repair in a rolled-back local fixture
        run: |
          psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" \
            -v ON_ERROR_STOP=1 -v axon_local_fixture=1 \
            -f docs/sql/claude_restore-commit-totals-regression-2026-10-03.sql

  # Merging a migration now applies it (.github/workflows/migrate.yml). This job
  # stays as the PR-time warning, and keeps its original name because a branch
  # protection rule may name it. It never fails: a red check here would be a
  # check somebody turns off; this is a summary a reviewer reads.
  migration-notice:
    name: migrations need applying by hand
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Say so, loudly, if this PR adds a migration
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" \
            -- 'supabase/migrations/*.sql' || true)

          if [ -z "$changed" ]; then
            echo "No migration files touched." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "## This PR changes the database schema"
            echo
            echo '```'
            echo "$changed"
            echo '```'
            echo
            echo "**Merging applies these** via \`.github/workflows/migrate.yml\` (needs the"
            echo "\`SUPABASE_DB_URL\` secret; it fails loudly if that is missing). It only"
            echo "applies files the live ledger does not already have, by name."
            echo "\`supabase db reset --local\` above builds a throwaway database for the"
            echo "pgTAP suites and destroys it; the live project is never touched."
            echo
            echo "If code in this PR **reads** anything these add, land the migration"
            echo "**first** (own PR, or run the workflow's dry run, then merge) —"
            echo "PostgREST errors on an unknown column, so a select naming one that is not"
            echo "there yet takes the whole screen down rather than degrading."
            echo
            echo "See \`supabase/migrations/README.md\`."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::warning title=Migration applies on merge::This PR changes supabase/migrations/. Merging applies it to production via migrate.yml; apply it before merging any code that reads it."

  upload-browser-recovery:
    name: Native upload recovery (Chromium and WebKit)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.head_ref == 'codex/axo-188-resumable-batch-uploads'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test tests/e2e/upload-recovery.spec.ts tests/e2e/local-data.spec.ts tests/e2e/student-scope-household.spec.ts --retries=0
