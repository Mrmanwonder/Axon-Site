<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000"><rect width="1600" height="1000" fill="#000000"/><text x="40" y="64" font-family="Onest, system-ui, sans-serif" font-size="34" font-weight="650" fill="#F5F5F7">Social reference board</text><text x="40" y="100" font-family="Onest, system-ui, sans-serif" font-size="22" fill="rgba(235,235,245,.6)">Solid outline = acceptable. Dashed = not Axon. Built from tokens.css.</text><g><rect x="40" y="140" rx="24" width="360" height="400" fill="#151517" stroke="#3A86FF" stroke-width="2" /><g transform="translate(0,0)"><rect x="60" y="150" width="320" height="170" rx="16" fill="#000"/><circle cx="330" cy="190" r="70" fill="rgba(58,134,255,.26)"/><text x="80" y="260" font-family="Onest, system-ui, sans-serif" font-size="40" font-weight="600" fill="#F5F5F7">See where</text><text x="80" y="304" font-family="Onest, system-ui, sans-serif" font-size="40" font-weight="600" fill="#F5F5F7">marks went.</text></g><text x="68" y="478" font-family="Onest, system-ui, sans-serif" font-size="26" font-weight="600" fill="#F5F5F7">Flat black, one accent</text><text x="68" y="512" font-family="Onest, system-ui, sans-serif" font-size="22" fill="rgba(235,235,245,.6)">Token bg, one blue glow</text></g><g><rect x="430" y="140" rx="24" width="360" height="400" fill="#151517" stroke="#3A86FF" stroke-width="2" /><g transform="translate(390,0)"><circle cx="92" cy="240" r="17" fill="#4C7DF0"/><circle cx="136" cy="240" r="17" fill="#3FA9A0"/><circle cx="180" cy="240" r="17" fill="#8A6FD1"/><circle cx="224" cy="240" r="17" fill="#C98A3E"/><circle cx="268" cy="240" r="17" fill="#C46B8A"/><circle cx="312" cy="240" r="17" fill="#7C9455"/><circle cx="356" cy="240" r="17" fill="#78808F"/><text x="80" y="300" font-family="Onest, system-ui, sans-serif" font-size="22" fill="rgba(235,235,245,.6)">kind, not severity</text></g><text x="458" y="478" font-family="Onest, system-ui, sans-serif" font-size="26" font-weight="600" fill="#F5F5F7">Cause hues, equal weight</text><text x="458" y="512" font-family="Onest, system-ui, sans-serif" font-size="22" fill="rgba(235,235,245,.6)">Enum order, no ramp</text></g><g><rect x="820" y="140" rx="24" width="360" height="400" fill="#151517" stroke="#3A86FF" stroke-width="2" /><g transform="translate(780,0)"><rect x="120" y="140" width="130" height="190" rx="22" fill="#000" stroke="rgba(255,255,255,.075)" stroke-width="2"/><rect x="134" y="160" width="102" height="34" rx="8" fill="#151517"/><rect x="134" y="204" width="102" height="60" rx="8" fill="#151517"/><rect x="134" y="274" width="60" height="12" rx="6" fill="#3A86FF"/></g><text x="848" y="478" font-family="Onest, system-ui, sans-serif" font-size="26" font-weight="600" fill="#F5F5F7">Real UI, synthetic data</text><text x="848" y="512" font-family="Onest, system-ui, sans-serif" font-size="22" fill="rgba(235,235,245,.6)">One screen or card, no bezel</text></g><g><rect x="1210" y="140" rx="24" width="360" height="400" fill="#151517" stroke="#3A86FF" stroke-width="2" /><g transform="translate(1170,0)"><rect x="70" y="150" width="300" height="170" rx="10" fill="#EDEDF1"/><path d="M92 196H320M92 230H284M92 264H210" stroke="#3A3A3E" stroke-width="5" stroke-linecap="round"/><path d="M300 250l16 16 30-36" stroke="#D8462F" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="1238" y="478" font-family="Onest, system-ui, sans-serif" font-size="26" font-weight="600" fill="#F5F5F7">Teacher's ink only</text><text x="1238" y="512" font-family="Onest, system-ui, sans-serif" font-size="22" fill="rgba(235,235,245,.6)">Red only as pen on paper</text></g><g><rect x="40" y="560" rx="24" width="360" height="400" fill="#151517" stroke="rgba(235,235,245,.32)" stroke-width="2" stroke-dasharray="10 10"/><g transform="translate(0,420)"><defs><linearGradient id="m" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a3df0"/><stop offset=".5" stop-color="#2b6cff"/><stop offset="1" stop-color="#18d0c8"/></linearGradient></defs><rect x="60" y="150" width="320" height="170" rx="16" fill="url(#m)"/></g><text x="68" y="898" font-family="Onest, system-ui, sans-serif" font-size="26" font-weight="600" fill="#F5F5F7">Neon mesh gradient</text><text x="68" y="932" font-family="Onest, system-ui, sans-serif" font-size="22" fill="rgba(235,235,245,.6)">Stock 'AI' background</text></g><g><rect x="430" y="560" rx="24" width="360" height="400" fill="#151517" stroke="rgba(235,235,245,.32)" stroke-width="2" stroke-dasharray="10 10"/><g transform="translate(390,420)"><circle cx="140" cy="235" r="56" fill="none" stroke="#78808F" stroke-width="14"/><text x="215" y="255" font-family="Onest, system-ui, sans-serif" font-size="64" font-weight="700" fill="#F5F5F7">78%</text></g><text x="458" y="898" font-family="Onest, system-ui, sans-serif" font-size="26" font-weight="600" fill="#F5F5F7">Giant score / percentage</text><text x="458" y="932" font-family="Onest, system-ui, sans-serif" font-size="22" fill="rgba(235,235,245,.6)">A big number is a verdict</text></g><g><rect x="820" y="560" rx="24" width="360" height="400" fill="#151517" stroke="rgba(235,235,245,.32)" stroke-width="2" stroke-dasharray="10 10"/><g transform="translate(780,420)"><rect x="130" y="170" width="180" height="130" rx="30" fill="#3A3A3E"/><circle cx="180" cy="225" r="18" fill="#9bd"/><circle cx="260" cy="225" r="18" fill="#9bd"/><rect x="190" y="266" width="60" height="10" rx="5" fill="#9bd"/><rect x="210" y="140" width="20" height="30" fill="#3A3A3E"/></g><text x="848" y="898" font-family="Onest, system-ui, sans-serif" font-size="26" font-weight="600" fill="#F5F5F7">Robot, brain, glowing chip</text><text x="848" y="932" font-family="Onest, system-ui, sans-serif" font-size="22" fill="rgba(235,235,245,.6)">Generic AI imagery</text></g><g><rect x="1210" y="560" rx="24" width="360" height="400" fill="#151517" stroke="rgba(235,235,245,.32)" stroke-width="2" stroke-dasharray="10 10"/><g transform="translate(1170,42