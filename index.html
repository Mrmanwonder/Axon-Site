<title>Axon — understand where your marks go</title>

<style>
  /* Slow phones should never stare at an unexplained black page while the app
     bundle and account session initialise. The mark appears only after 350ms,
     so a normal fast boot still has no loading flash. React replaces it. */
  .bootmark{position:fixed;inset:0;display:grid;place-items:center;color:#f5f5f7;
    background:#000;font:650 20px/1 system-ui,sans-serif;letter-spacing:-.03em;
    opacity:0;animation:bootmark-reveal 0s linear .35s forwards}
  [data-theme="light"] .bootmark{color:#1d1d1f;background:#f4f4f7}
  @keyframes bootmark-reveal{to{opacity:1}}
  @media (prefers-reduced-motion:reduce){.bootmark{animation:none;opacity:1}}
</style>

<!-- The face is font-display: block, so it must arrive early or the first paint
     is blank text. Before the port it was a data URI inside this document and
     painted on the first frame with no network at all; as a real asset it is one
     request, preloaded here and cached immutably. -->
<link rel="preload" href="/fonts/onest-latin-var.woff2" as="font" type="font/woff2" crossorigin>

<script>
  /* Display preferences applied before the first paint, read from the same
     localStorage mirror `src/prefs.js` writes. src/prefs.js remains the owner of
     the state; this only paints it early, so a student who chose light does not
     get a frame of black, and one who chose dark never gets a flash of white at
     1am.

     Inline and tiny on purpose: a module import lands after the first paint,
     which is the entire problem this solves. Keep the key in step with
     LOCAL_KEY in src/prefs.js. */
  (function () {
    try {
      var p = JSON.parse(localStorage.getItem('axon.prefs.v1') || '{}');
      var theme = (p.theme === 'light' || p.theme === 'dark')
        ? p.theme
        : (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      var root = document.documentElement;
      root.dataset.theme = theme;
      root.dataset.text = p.text_size || 'm';
      root.dataset.motion = p.reduce_motion ? 'reduce' : 'full';
      document.getElementById('themeColor')
        .setAttribute('content', theme === 'dark' ? '#000000' : '#F4F4F7');
    } catch (e) { /* private mode; the dark default is already correct */ }
  })();
</script>
</head>
<body>
  <div id="root"><div class="bootmark" role="status" aria-label="Loading Axon">Axon</div></div>
  <script type="module" src="/src/ui/main.tsx"></script>
</body>
