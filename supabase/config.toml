# Local/CI parity for project settings that otherwise live only in the Supabase
# Dashboard.
#
# This file is currently empty of settings, and that is the accurate state
# rather than an oversight. It used to carry [auth.passkey] and [auth.webauthn],
# which were the only things in it; passkeys have been removed from the product,
# so those sections went with them.
#
# The file is kept rather than deleted because it is where a Dashboard-only
# setting belongs the moment one is needed again, and because deleting it would
# invite the next such setting to be made in the Dashboard alone — which is how
# a project setting ends up existing nowhere in version control.
#
# Nothing else here on purpose: no [api], [db] or [auth] sections, since adding
# them would imply this file drives local development, which it does not.
#
# ── On passkeys ───────────────────────────────────────────────────────────
#
# They were never enabled. `enabled` was false here, the Dashboard toggle was
# never turned on for dlgcqieyevoebefhcggi, and `rp_id` was still "localhost" —
# so no parent ever registered one (auth.mfa_factors was empty when this was
# checked). Removing the feature stranded nobody.
#
# If they come back: rp_id is cryptographically bound into every passkey
# registered under it, and changing it later invalidates all of them with no
# migration path. It must be the real production bare domain — no scheme, no
# port, no path — before the Dashboard toggle goes on.
