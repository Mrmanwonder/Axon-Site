# Axon is a Vite + React app. The build emits to dist/, which holds only what
# belongs on the web — the Constitution specs, the blueprint, the design
# reference images, bench/, harness/ and reference/ are all in the repo and none
# of them are fetchable from the public site.

[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Real routing means real URLs, and a deep link to /library/<paper>/<question>
# has to resolve on a cold load rather than 404 at the CDN before React runs.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self' https://*.supabase.co; script-src 'self' 'unsafe-inline' https://*.posthog.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.supabase.co https://mastery-api.tanmay-harkawat.workers.dev https://*.r2.cloudflarestorage.com; font-src 'self'; connect-src 'self' https://*.posthog.com https://*.supabase.co wss://*.supabase.co https://mastery-api.tanmay-harkawat.workers.dev https://*.r2.cloudflarestorage.com; worker-src 'self' blob: data:; media-src 'self' blob:"
    # The scanner's viewfinder needs the camera, and nothing else here does.
    # Stated rather than left to the default, so an embedded frame or a
    # third-party script cannot reach it.
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

# Browsers revalidate the HTML so a deploy reaches them immediately. The CDN is
# allowed to hold the generic SPA document briefly and serve stale while it
# refreshes in the background; no student/account data is present in this file.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    CDN-Cache-Control = "public, max-age=300, stale-while-revalidate=86400"
    Cloudflare-CDN-Cache-Control = "public, max-age=300, stale-while-revalidate=86400"
    Link = "</fonts/onest-latin-var.woff2>; rel=preload; as=font; type=font/woff2; crossorigin"

# Vite fingerprints these, so they can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The font is no longer embedded in the document, so it needs its own header.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


# Crawlers should see fresh policy/sitemap changes quickly without bypassing the
# CDN entirely.
[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/xml; charset=utf-8"
